# =============================================================================
# neuralhyd-ca - single-LSTM gauge baseline
# Run with: python scripts/train_kfold.py scripts/cfg_single_lstm.toml
#
# This config excludes dual-pathway, MoE, CMAL, and regime-gate sections because
# the single baseline reads only one recurrent hidden size plus shared training
# and feature settings.
# =============================================================================

[paths]
# Paths are resolved relative to this TOML file.  The output directory is
# derived from the filename: cfg_single_lstm.toml -> output/single_lstm/.
data_dir             = "../data"
climate_zarr          = "../data/training/climate/watersheds.zarr"
flow_zarr             = "../data/training/flow.zarr"
static_basin_atlas   = "../data/training/static/watersheds/Physical_Attributes_Watersheds.csv"
static_climate       = "../data/training/static/watersheds/Climate_Statistics_Watersheds.csv"

[basins]
# "gages" uses the gauge watershed domain.  CDEC full-natural-flow basins are
# included when their flow, climate, and static rows are available.
training_manifest    = "gages"
include_cdec_basins  = true
normalize_by_precip  = true

[sequence]
# One full-year lookback feeds the single LSTM.  No fast-window settings apply.
seq_len              = 365

[model]
# model_type="single" builds SingleLSTM.  q_fast and q_slow are zero placeholders
# to keep the shared training/evaluation interface stable.
model_type           = "single"
single_hidden_size   = 128
static_embedding_dim = 10
static_hidden_size   = 32
dropout              = 0.15
static_dropout       = 0.10
basin_loss_weight_exponent = 0.50

[blended_loss]
# Primary deterministic objective: (1 - lambda) * MSE + lambda * log-MSE.
log_loss_lambda      = 0.05
log_loss_epsilon     = 0.001

[training]
# AdamW schedule: warmup, cosine annealing, early stopping, then optional SWA.
batch_size           = 512
learning_rate        = 4e-4
weight_decay         = 1e-4
input_noise_std      = 0.1
warmup_epochs        = 3
num_epochs           = 80
patience             = 8
min_delta            = 0.002
num_workers          = 0
grad_clip            = 1.0
use_swa              = true
swa_lr               = 2e-4
swa_patience         = 10

[validation]
# Spatial k-fold validation splits basins, not timesteps.
n_folds              = 5
seed                 = 42

[features]
# Dynamic features are daily forcings.  Static features are consumed in order by
# the flat StaticEncoder; comments show the source table and physical group.
dynamic_features = ["precip_mm", "tmax_c", "tmin_c"]
static_features  = [
    # topography - Physical CSV
    "total_Shape_Area_km2",
    "ele_mt_uav",
    "slp_dg_uav",
    # river network - Physical CSV
    "ria_ha_usu",
    "riv_tc_usu",
    "sgr_dk_sav",
    # soil and surface - Physical CSV
    "for_pc_use",
    "cly_pc_uav",
    "snd_pc_uav",
    "clz_cl_smj",
    "lit_cl_top1",
    # climate normals - Climate CSV
    "aridity_index",
    "snow_fraction",
    "pet_mean",
    "high_precip_freq",
    "precip_mean",
    "low_precip_dur",
    "high_precip_dur",
]
log_transform_static = ["total_Shape_Area_km2", "ria_ha_usu"]