name: neuralhyd
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  # ML / numerics
  - scipy>=1.10
  - pytorch>=2.0
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - shapely>=2.0
  # visualization
  - matplotlib>=3.7
  # data retrieval / storage
  - geopandas>=0.13
  - dataretrieval>=1.1.2
  - zarr>=3.0
  - xarray
  # HTTP / utilities
  - requests
  - tqdm>=4.65
  - pyarrow
  # web app
  - pip
  - pip:
      - fastapi
      - uvicorn[standard]
      - pydantic>=2.10
      - orjson>=3.9
      - optuna>=3.0
      - sphinx>=7.0
      - furo>=2024.0
      - pynhd>=0.16
