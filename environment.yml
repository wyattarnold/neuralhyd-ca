name: neuralhyd
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  # ML / numerics
  - pytorch>=2.0
  - numpy>=1.24
  - pandas>=2.0
  - shapely>=2.0
  # visualization
  - matplotlib>=3.7
  - cartopy>=0.22
  # data retrieval / storage
  - geopandas>=0.13
  - dataretrieval>=1.1.2
  - zarr>=3.0
  - xarray
  - netcdf4
  # HTTP / utilities
  - requests
  - tqdm>=4.65
  - pyarrow
  # web app
  - pip
  - pip:
      - fastapi
      - uvicorn[standard]
      - pydantic>=2.10
      - sphinx>=7.0
      - furo>=2024.0
      - earthengine-api  # (gridded AlphaEarth prep only)
